server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the built SPA, falling back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container. VITE_API_URL is "/api" (see
    # .env.example), so api.ts's calls resolve to same-origin "/api/..."
    # paths — this catches them and forwards to the backend, prefix intact
    # (no URI after the host below means nginx passes the request through
    # unmodified, so /api/load_sessions reaches the backend as /api/load_sessions).
    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # needed for chat_stream's SSE — don't buffer, stream chunks through immediately
        proxy_buffering off;
        proxy_cache off;

        # kept in case any route ever needs it (e.g. websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # StorageRoutes is mounted at "/" in VGateway, not under /api, so its
    # routes (list_files, upload) live at the backend root — match them
    # explicitly here, or they'll fall through to the SPA instead of the API.
    # Add any new storage route names to this list as they're added.
    location ~ ^/(list_files|upload|delete)(/|$) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;  # matches multer's fileSize limit in storage_routes.ts
    }
}